name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A second push while the first is still deploying would race for gh-pages.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.160.1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # --buildFuture: articles are dated ahead of today, and without it Hugo
      # silently drops them from the build.
      - name: Build with Hugo
        run: hugo --minify --buildFuture --cleanDestinationDir

      # The custom domain lives in static/CNAME so Hugo copies it into public/.
      # If it ever goes missing the deploy would quietly unset the domain, so
      # fail loudly instead.
      - name: Verify CNAME survived the build
        run: |
          test -f public/CNAME || { echo "::error::public/CNAME missing — static/CNAME was not copied"; exit 1; }
          echo "CNAME: $(cat public/CNAME)"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
