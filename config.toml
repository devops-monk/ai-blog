baseURL = "https://ai.devops-monk.com/"
languageCode = "en-us"
title = "AI Engineering"
theme = "wellington"
paginate = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

disqusShortname = ""
googleAnalytics = ""
enableRobotsTXT = true
preserveTaxonomyNames = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "nord"
    codeFences = true
    lineNos = false
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[taxonomies]
  category = "categories"
  tag = "tags"

[Params.widgets]
    search = true
    recent_articles = true
    recent_articles_num = 5
    categories = true
    tags = true
    tags_counter = false

[menu]

  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Guide"
    url = "/guide/"
    weight = 2

  [[menu.main]]
    name = "Topics"
    identifier = "topics"
    weight = 4

  [[menu.main]]
    name = "Permissions"
    parent = "topics"
    url = "/tags/permissions/"
    weight = 1

  [[menu.main]]
    name = "Context"
    parent = "topics"
    url = "/tags/context/"
    weight = 2

  [[menu.main]]
    name = "Skills"
    parent = "topics"
    url = "/tags/skills/"
    weight = 3

  [[menu.main]]
    name = "Hooks"
    parent = "topics"
    url = "/tags/hooks/"
    weight = 4

  [[menu.main]]
    name = "MCP"
    parent = "topics"
    url = "/tags/mcp/"
    weight = 5

  [[menu.main]]
    name = "Subagents"
    parent = "topics"
    url = "/tags/subagents/"
    weight = 6

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5

[Params]
  # Reading order of the series, used by layouts/partials/series-nav.html to
  # chain the volumes into one continuous order. Each article names its volume
  # in `series` and its position in `series_order`.
  series_sequence = [
    "Part 1 — Foundations",
    "Part 2 — Context Engineering",
    "Part 3 — Teaching Claude New Tricks",
    "Part 4 — Connecting Claude to the World",
    "Part 5 — Agents & Autonomy",
    "Part 6 — Running It for Real",
    "Closing",
  ]
  author = "Abhay"
  publisher = "AI Engineering by Abhay"
  subtitle = "Master Claude Code"
  description = "A 23-chapter handbook for Claude Code — permissions, context, skills, hooks, MCP and agents, worked out end to end for engineers who have to ship with it."
